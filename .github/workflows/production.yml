name: Deploy CahayaPOS ke Server Production

on:
  push:
    branches: [ production ]  # Workflow akan berjalan saat ada push ke branch 'production'
  pull_request:
    branches: [ production ]  # Workflow juga berjalan saat ada pull request ke 'production'

jobs:
  deploy-to-production:
    name: Deploy ke Server Production
    runs-on: ubuntu-latest  # Job akan dijalankan pada mesin virtual Ubuntu versi terbaru

    steps:
      - name: Checkout repository (opsional)
        uses: actions/checkout@v4
        # Langkah ini berguna jika kamu butuh akses ke source code secara lokal (tidak digunakan langsung di script SSH)

      - name: Deploy via SSH ke server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}              # Host server, disimpan di GitHub Secrets
          username: ${{ secrets.SSH_USERNAME }}      # Username SSH server
          key: ${{ secrets.SSH_PRIVATE_KEY }}        # Private key SSH (tanpa passphrase)
          port: ${{ secrets.SSH_PORT }}              # Port SSH (default biasanya 22)
          script: |
            echo "Pindah ke direktori project..."
            cd /home/cahaya.hokkie.id/public_html

            echo "Simpan perubahan lokal (jika ada)..."
            git stash

            echo "Ambil update terbaru dari branch production..."
            git pull origin production

            echo "Ganti versi PHP ke 8.0..."
            sudo update-alternatives --set php /usr/bin/php8.0

            echo "Menjalankan migrasi database Laravel..."
            php artisan migrate --force

            echo "Membersihkan dan mengoptimalkan cache Laravel..."
            php artisan optimize:clear

            echo "Mengatur permission folder storage dan bootstrap/cache..."
            sudo chmod -R 777 storage
            sudo chmod -R 777 bootstrap/cache

            echo "✅ Proses deploy selesai."
